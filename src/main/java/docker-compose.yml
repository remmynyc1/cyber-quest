version: '3.8'

services:
  cyberquest_primary:
    image: postgres:15-alpine
    container_name: cyberquest_primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberquest
      POSTGRES_USER: cq_admin
      POSTGRES_PASSWORD: cqadmin26
    ports:
      - "5432:5432"
    volumes:
      - cq_data:/var/lib/postgresql/data

  hr_mock_system:
    image: postgres:15-alpine
    container_name: hr_mock_system
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_mock_system
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: hradmin26
    ports:
      - "5433:5432"
    volumes:
      - hr_data:/var/lib/postgresql/data

volumes:
  cq_data:
  hr_data: