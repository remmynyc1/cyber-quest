# Portable build: one file-based database, no Docker, no HR database.
# Activated with -Dspring.profiles.active=portable (see portable/start.bat).
spring.datasource.url=jdbc:h2:file:./data/cyberquest
spring.datasource.driver-class-name=org./data/cyberquest
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Only this computer can reach the app.
server.address=127.0.0.1 
server.port=8080

# The mock HR database is not part of the portable package.
cq.hr-sync.enabled=false 

# Log to a file because the app runs without a console window.
logging.file.name=logs/cyberquest.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3 