spring.application.name=demo

# --- Databases: credentials come from the environment (see .env.example). No defaults on purpose. ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberquest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

hr.datasource.url=${HR_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hr_mock_system}
hr.datasource.username=${HR_DATASOURCE_USERNAME}
hr.datasource.password=${HR_DATASOURCE_PASSWORD}
hr.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# TODO: replace ddl-auto=update with Flyway migrations before any real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# --- Demo account passwords (override via CQ_SEED_MANAGER_PASSWORD / CQ_SEED_EMPLOYEE_PASSWORD) ---
cq.seed.manager-password=${CQ_SEED_MANAGER_PASSWORD:manager26}
cq.seed.employee-password=${CQ_SEED_EMPLOYEE_PASSWORD:employee26}
