spring.application.name=demo

# Server port dynamically provided by cloud hosts (defaults to 8080 locally)
server.port=${PORT:8080}

# --- Databases: Primary Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberquest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cq_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cqadmin26}
spring.datasource.driver-class-name=org.postgresql.Driver

server.forward-headers-strategy=framework

server.tomcat.use-relative-redirects=true


# --- Databases: HR Datasource (with safe defaults) ---
hr.datasource.url=${HR_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hr_mock_system}
hr.datasource.username=${HR_DATASOURCE_USERNAME:cq_admin}
hr.datasource.password=${HR_DATASOURCE_PASSWORD:cqadmin26}
hr.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Hardening ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# --- Demo account passwords ---
cq.seed.manager-password=${CQ_SEED_MANAGER_PASSWORD:Password123!}
cq.seed.employee-password=${CQ_SEED_EMPLOYEE_PASSWORD:Password123!}