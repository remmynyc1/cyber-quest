<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quest // Change password</title>
    <style>
        :root { --bg-dark:#070b12; --panel-bg:#0f172a; --border:#1e293b; --text-main:#f8fafc; --text-muted:#94a3b8;
                --cyan:#38bdf8; --green:#4ade80; --red:#f87171; }
        * { box-sizing: border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-dark); color:var(--text-main); margin:0;
               min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        :focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
        .box { background:var(--panel-bg); border:1px solid var(--border); border-radius:10px; padding:28px; width:100%; max-width:420px; }
        h1 { margin:0 0 6px; font-size:20px; color:var(--cyan); }
        p { color:var(--text-muted); font-size:13px; margin:0 0 16px; }
        label { display:block; font-size:12px; color:var(--text-muted); margin:12px 0 4px; }
        input { width:100%; background:#080c14; border:1px solid var(--border); color:var(--text-main); border-radius:6px; padding:10px 12px; font-size:14px; }
        button { width:100%; margin-top:18px; background:var(--cyan); color:#04121c; border:none; border-radius:6px; padding:11px; font-size:14px; font-weight:700; cursor:pointer; }
        button:disabled { opacity:.5; }
        #msg { margin-top:12px; font-size:13px; min-height:18px; }
        .bad { color:var(--red); } .ok { color:var(--green); }
        ul { color:var(--text-muted); font-size:12px; padding-left:18px; margin:10px 0 0; }
        a { color:var(--text-muted); font-size:12px; }
    </style>
</head>
<body>
    <main class="box">
        <h1>Choose a new password</h1>
        <p>You are using a temporary password. Set your own before continuing.</p>
        <form id="f">
            <label for="cur">Current (temporary) password</label>
            <input id="cur" type="password" autocomplete="current-password" required>
            <label for="neu">New password</label>
            <input id="neu" type="password" autocomplete="new-password" required>
            <label for="con">Confirm new password</label>
            <input id="con" type="password" autocomplete="new-password" required>
            <ul>
                <li>At least 12 characters, with a letter and a number</li>
                <li>Different from your temporary password</li>
                <li>A few random words works well, for example Blue-Harbor-Seven-42</li>
            </ul>
            <button id="go" type="submit">Save password</button>
            <div id="msg" role="status"></div>
        </form>
        <p style="margin-top:14px;"><a href="/logout">Sign out</a></p>
    </main>
    <script src="/common.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        $('f').addEventListener('submit', async e => {
            e.preventDefault();
            if ($('neu').value !== $('con').value) { $('msg').className = 'bad'; $('msg').textContent = 'The new passwords do not match.'; return; }
            $('go').disabled = true;
            const r = await fetch('/api/account/password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword: $('cur').value, newPassword: $('neu').value }) });
            const d = await r.json().catch(() => ({}));
            if (r.ok) { $('msg').className = 'ok'; $('msg').textContent = 'Password updated. Redirecting...'; setTimeout(() => location.href = '/', 800); }
            else { $('msg').className = 'bad'; $('msg').textContent = d.message || 'Could not update the password.'; $('go').disabled = false; }
        });
    </script>
</body>
</html>
