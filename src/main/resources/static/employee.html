<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quest // Operative Defense Terminal</title>
    <style>
        :root {
            --bg-dark: #070b12;
            --panel-bg: #0f172a;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --cyan: #38bdf8;
            --green: #4ade80;
            --red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 { margin: 0; font-size: 18px; color: var(--cyan); }

        .stats-bar {
            display: flex;
            gap: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--green); }

        .quest-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tool-badge {
            font-size: 11px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--cyan);
            margin-bottom: 12px;
            display: inline-block;
        }

        .btn-artifact {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: var(--cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .btn-artifact:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            background: #080c14;
            border: 1px solid var(--border);
            padding: 9px 12px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
        }

        button {
            background: var(--cyan);
            color: #070b12;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .result-msg { font-size: 12px; font-weight: 600; margin-left: 8px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>CYBER QUEST // DEFENSIVE OPERATIVE TERMINAL</h1>
            <span style="font-size: 12px; color: var(--text-muted);" id="userEmail">Loading profile...</span>
        </div>
        <div>
            <a href="/logout" style="color: var(--red); font-size: 12px; text-decoration: none; font-weight: 700; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 6px;">Terminate Session</a>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">Operative Call-Sign</span>
            <span class="stat-val" style="color: var(--cyan);" id="userName">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Total Earned XP</span>
            <span class="stat-val" id="totalXp">0 XP</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Quests Completed</span>
            <span class="stat-val" style="color: white;" id="completedCount">0</span>
        </div>
    </div>

    <div id="challenge-list">
        <div style="text-align: center; color: var(--text-muted);">Loading defensive quest modules...</div>
    </div>

    <script>
        let completedIds = [];

        async function loadProfile() {
            try {
                const res = await fetch('/api/quest/my-stats');
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('userName').innerText = data.fullName;
                document.getElementById('userEmail').innerText = data.email;
                document.getElementById('totalXp').innerText = data.totalXp + ' XP';
                completedIds = data.completedChallenges || [];
                document.getElementById('completedCount').innerText = completedIds.length + ' / 3';
            } catch (err) {
                console.error(err);
            }
        }

        async function loadChallenges() {
            try {
                await loadProfile();
                const res = await fetch('/api/quest/challenges');
                const challenges = await res.json();
                const container = document.getElementById('challenge-list');

                container.innerHTML = challenges.map(ch => {
                    const isSolved = completedIds.includes(ch.id);
                    return `
                        <div class="quest-card" style="${isSolved ? 'border-color: rgba(74, 222, 128, 0.4);' : ''}">
                            <div class="quest-header">
                                <h3 style="margin: 0; color: ${isSolved ? 'var(--green)' : 'var(--cyan)'}; font-size: 15px;">
                                    ${isSolved ? '✔ ' : ''}${ch.title}
                                </h3>
                                <span style="background: rgba(74, 222, 128, 0.15); color: var(--green); padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px;">
                                    +${ch.pointValue} XP
                                </span>
                            </div>

                            <span class="tool-badge">Required Tool: ${ch.requiredTool || 'Terminal / CLI'}</span>
                            <p style="color: #cbd5e1; font-size: 13px; line-height: 1.5; margin: 0 0 14px 0;">${ch.scenario}</p>

                            <a href="/api/quest/artifacts/${ch.id}" class="btn-artifact">
                                ⬇ Download Forensic Artifact (${ch.artifactName})
                            </a>

                            <div class="input-row">
                                <input type="text" id="flag-${ch.id}" placeholder="${isSolved ? 'Artifact verified and mitigated' : 'Enter extracted IOC or flag'}" ${isSolved ? 'disabled' : ''}>
                                <button onclick="submitFlag(${ch.id})" ${isSolved ? 'disabled' : ''}>
                                    ${isSolved ? 'Mitigated' : 'Verify & Mitigate'}
                                </button>
                                <span id="result-${ch.id}" class="result-msg"></span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Challenge load error:', err);
            }
        }

        async function submitFlag(id) {
            const input = document.getElementById(`flag-${id}`);
            const resultSpan = document.getElementById(`result-${id}`);
            const answer = input ? input.value.trim() : '';

            if (!answer) {
                resultSpan.innerText = 'Enter an IOC before submitting.';
                resultSpan.style.color = 'var(--red)';
                return;
            }

            try {
                const res = await fetch(`/api/quest/challenges/${id}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer: answer })
                });

                const data = await res.json();

                if (res.ok && data.status === 'SUCCESS') {
                    resultSpan.innerText = `+${data.pointsEarned} XP Awarded! ${data.message}`;
                    resultSpan.style.color = 'var(--green)';
                    await loadChallenges();
                } else {
                    resultSpan.innerText = data.message || 'Submission rejected.';
                    resultSpan.style.color = 'var(--red)';
                }
            } catch (err) {
                resultSpan.innerText = 'Network communication failure.';
                resultSpan.style.color = 'var(--red)';
            }
        }

        document.addEventListener('DOMContentLoaded', loadChallenges);
    </script>
</body>
</html>
