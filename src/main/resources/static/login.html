<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quest // Defense Access</title>
    <style>
        :root {
            --bg-dark: #070b12; --panel-bg: #0f172a; --border: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --cyan: #38bdf8; --cyan-glow: rgba(56, 189, 248, 0.25);
            --green: #4ade80; --red: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-dark);
            color: var(--text-main); margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }
        :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        .box { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; padding: 28px; width: 100%; max-width: 420px; }
        h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; color: var(--cyan); }
        p { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; line-height: 1.4; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin: 12px 0 4px; }
        input {
            width: 100%; background: #080c14; border: 1px solid var(--border); color: var(--text-main);
            border-radius: 6px; padding: 10px 12px; font-size: 14px; transition: border-color 0.15s ease;
        }
        input:focus { border-color: var(--cyan); outline: none; }
        button {
            width: 100%; margin-top: 18px; background: var(--cyan); color: #04121c; border: none;
            border-radius: 6px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover { filter: brightness(1.08); box-shadow: 0 0 14px var(--cyan-glow); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-banner {
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.4); color: var(--red);
            padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; margin-bottom: 16px; display: none;
        }
    </style>
</head>
<body>
    <main class="box">
        <h1>CYBER QUEST // DEFENSE ACCESS</h1>
        <p>SOC Telemetry &amp; Defensive Range Gateway</p>

        <div id="errorBanner" class="error-banner" role="alert">
            Sign-in failed. Check your email and password. After 5 failed attempts an account is locked for 15 minutes.
        </div>

        <form action="/login" method="post">
            <label for="username">Work email</label>
            <input id="username" type="text" name="username" placeholder="name@cyberquest.internal" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </main>

    <script>
        if (window.location.search.includes('error')) {
            document.getElementById('errorBanner').style.display = 'block';
        }
    </script>
</body>
</html>
