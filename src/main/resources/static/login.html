<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quest // Secure Gateway Login</title>
    <style>
        :root {
            --bg-dark: #070b12;
            --panel-bg: #0f172a;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --cyan: #38bdf8;
            --cyan-glow: rgba(56, 189, 248, 0.25);
            --green: #4ade80;
            --red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--cyan);
            font-size: 20px;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: #080c14;
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        button {
            width: 100%;
            background: var(--cyan);
            color: #070b12;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: box-shadow 0.2s;
        }

        button:hover {
            box-shadow: 0 0 14px var(--cyan-glow);
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--red);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .credential-hints {
            margin-top: 24px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .credential-hints strong {
            color: var(--cyan);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h1>CYBER QUEST // DEFENSE ACCESS</h1>
            <p>SOC Telemetry & Defensive Range Gateway</p>
        </div>

        <div id="errorBanner" class="error-banner">
            Invalid credentials. Authentication rejected.
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label>Operative / Supervisor Identity</label>
                <input type="text" name="username" placeholder="name@cyberquest.internal" required autofocus>
            </div>
            <div class="form-group">
                <label>Security Clearance Token</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Authenticate & Enter</button>
        </form>

        <div class="credential-hints">
            <div><strong>Supervisor:</strong> manager@cyberquest.internal / manager26</div>
            <div><strong>Operative:</strong> employee@cyberquest.internal / employee26</div>
        </div>
    </div>

    <script>
        if (window.location.search.includes('error')) {
            document.getElementById('errorBanner').style.display = 'block';
        }
    </script>
</body>
</html>
